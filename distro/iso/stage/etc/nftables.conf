#!/usr/bin/nft -f
# btw's firewall on a PC, always on (nftables.service loads it before the
# network comes up).
#
# Nothing outside can open a connection to this PC. This PC can reach
# anything: the internet and your own network (printers, shares, other
# computers). (In the Mac's VM, btw also keeps off your network; a PC is
# yours, so it doesn't.)
#
# To let something in, e.g. SSH from your network, put rules in
# /etc/nftables.d/<name>.input.nft, then load the rules again with
# `sudo nft -f /etc/nftables.conf`:
#
#     tcp dport 22 ip saddr 192.168.1.0/24 accept
#
# Check what's loaded with `sudo nft list table inet btw`.
table inet btw
delete table inet btw
table inet btw {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept
		# DHCP replies, and IPv6 neighbour discovery and router adverts.
		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
		meta l4proto ipv6-icmp accept
		include "/etc/nftables.d/*.input.nft"
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
