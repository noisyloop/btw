#!/usr/bin/nft -f
# btw's firewall, always on (nftables.service loads it before the network
# comes up).
#
# The VM may reach the internet, and nothing else: not your Mac, not your
# LAN, not other VMs. The only exceptions are DNS and DHCP, which the Mac's
# NAT answers at the gateway. Nothing outside can open a connection in.
#
# To open a hole, e.g. for SSH from your Mac, put rules in
# /etc/nftables.d/<name>.input.nft (or .output.nft), then load the rules
# again with `sudo nft -f /etc/nftables.conf`:
#
#     tcp dport 22 ip saddr 192.168.64.1 accept
#
# Check what's loaded with `sudo nft list table inet btw`.

define private4 = { 10.0.0.0/8, 100.64.0.0/10, 172.16.0.0/12, 169.254.0.0/16, 192.168.0.0/16, 224.0.0.0/4 }
define private6 = { fc00::/7, fe80::/10, ff00::/8 }

table inet btw
delete table inet btw

table inet btw {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept
		# DHCP replies, and IPv6 neighbour discovery and router adverts.
		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
		meta l4proto ipv6-icmp accept
		include "/etc/nftables.d/*.input.nft"
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
		oif lo accept
		ct state established,related accept
		meta l4proto ipv6-icmp accept
		include "/etc/nftables.d/*.output.nft"
		# DNS and DHCP to the Mac's NAT.
		ip daddr $private4 meta l4proto { tcp, udp } th dport 53 accept
		ip daddr $private4 udp dport 67 accept
		ip6 daddr $private6 meta l4proto { tcp, udp } th dport 53 accept
		ip6 daddr ff02::1:2 udp dport 547 accept
		# Everything else on private networks: your Mac, your LAN, other VMs.
		ip daddr $private4 reject with icmpx admin-prohibited
		ip6 daddr $private6 reject with icmpx admin-prohibited
	}
}
