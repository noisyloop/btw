# How WSL installs btw.wsl: its name, the first-launch setup, and the Start
# menu shortcut with btw's icon. (Read by WSL 2.4.4 and newer.)
[oobe]
command = /usr/lib/wsl/btw-oobe.sh
defaultUid = 1000
defaultName = btw

[shortcut]
enabled = true
icon = /usr/lib/wsl/btw.ico

[windowsterminal]
enabled = true
